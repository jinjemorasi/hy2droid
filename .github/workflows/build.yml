name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;28.0.12433566"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/28.0.12433566" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init

      - name: Check out sing-box
        run: |
          git clone --depth 1 --branch v1.15.0-alpha.12 https://github.com/SagerNet/sing-box.git /tmp/sing-box

      - name: Build libbox.aar
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_NDK_HOME=$HOME/android-sdk/ndk/28.0.12433566
          mkdir -p app/libs
          cd /tmp/sing-box
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go get -tool golang.org/x/mobile/cmd/gomobile@latest
          gomobile bind -o $GITHUB_WORKSPACE/app/libs/libbox.aar \
            -target=android \
            -javapkg=io.nekohasekai \
            -tags with_gvisor,with_quic,with_utls \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=v1.15.0-alpha.12 -X github.com/sagernet/sing-box/constant.VersionCode=745 -checklinkname=0 -s -w -buildid=" \
            ./experimental/libbox
          ls -lh $GITHUB_WORKSPACE/app/libs/libbox.aar

      - name: Build APK (otherDebug)
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          chmod +x gradlew
          ./gradlew assembleOtherDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hy2droid-sfa-debug-apk
          path: app/build/outputs/apk/other/debug/*.apk
